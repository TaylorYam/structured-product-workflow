[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-workflow"
version = "0.1.0"
description = "結構型商品作業流程：從商品資料夾準備 TS／IIS 批次（本機視窗工具）"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24,<2",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
spw-panel = "sp_workflow.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "real_samples: 只在本機設定 SPW_REAL_SAMPLES_DIR 時執行；CI 自動略過",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# 行長由 ruff format 管理；中文訊息字串不強制斷行
ignore = ["E501"]
