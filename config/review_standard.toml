# 審查標準（Review Standard）
#
# 受託機構會隨時間更新的審查基準集中在這個檔案。
# 基準改變時（例如受託機構重新審查、風險警語改版），只修改本檔，不改程式。
# 每次修改請更新 version 與 effective_date，並在 PR 說明變更原因。
#
# 本檔只放公開的條款文字與日期，不放客戶或交易資料。
# 規則說明見 docs/checker/rules/review-standard.md。

version = 33
effective_date = 2026-10-30

[distributor]
# 受託或銷售機構審查通過之日期（說明書封面 p1）：歷次日期都保留，由舊到新。
# 每份說明書應寫「交易日當天或之前最近一次」的日期。重新審查後在 PANEL「審查通過日期…」新增，
# 或在清單最後加一筆（同時更新上面的 version 與 effective_date）。
# 2025-06-24：受託機構真實的歷次審查日期（Nomura 2025 年文件寫這一天；2026-10-15 作業人員確認，Issue #239）。
# 比 PANEL 可新增的日期早，所以直接寫在設定檔；交易日早於 2025-12-18 的說明書改和這一天比。
# 2024-03-20、2024-08-28：受託機構真實的歷次審查日期（Natixis 2024 年文件、Citi 2024 年文件分別寫這兩天；2026-10-15
# 作業人員確認，Issue #261）。
approval_dates = [2024-03-20, 2024-08-28, 2025-06-24, 2025-12-18, 2026-06-11]

# 受託或銷售機構負責人（第二章「受託或銷售機構」→「負責人姓名」）
# 注意：「晋」為古字 U+664B，不可寫成「晉」U+6649；比對時逐字（含字碼）相等。
chairman = "林晋輝"

# 受託或銷售機構名稱、電話、地址（封面「受託或銷售機構之名稱、電話及地址」、第二章「受託或銷售機構」條）
# 比對時忽略空白與換行，其餘逐字相等。
name = "玉山綜合證券股份有限公司"
phone = "02-5556-1313"
# 電話可接受的其他寫法（所有上手適用）；忽略空白後與其中之一相等即視為相符，沒列出的寫法判定不一致。
# 國際寫法：HSBC 封面使用（2026-10-02 確認）；空格分隔的國際寫法：MS 封面使用（2026-10-08 確認）；
# 區碼加括號：BNP 封面與第四章使用（2026-10-13 確認）；國碼加括號：Citi 封面使用（2026-10-14 確認，Issue #220）。
# 區碼加括號、沒有空白：DBS 封面使用（2026-10-15 確認，Issue #280）。
phone_equivalents = ["+886-2-5556-1313", "+886 2 5556 1313", "+886 (2) 5556 1313", "(+886)2-5556-1313", "(02)5556-1313"]
address = "台北市松山區民生東路三段158號6樓"
# 地址可接受的其他寫法（所有上手適用，用法同 phone_equivalents）。
# 沒有「松山區」：MS 第二章受託機構營業所在地使用（2026-10-09 確認視為正確）。
# 「臺」、郵遞區號、沒有「松山區」：BNP 封面與第二章使用（2026-10-13 確認視為正確）。
# 阿拉伯數字「3段」：SG 封面使用（2026-10-13 確認視為正確）。
address_equivalents = ["台北市民生東路三段158號6樓", "臺北市105民生東路三段158號6樓", "台北市松山區民生東路3段158號6樓"]
# 名稱可接受的其他寫法（所有上手適用，用法同 phone_equivalents）。
# 簡稱「玉山證券」：SG 第二章受託或銷售機構的事業名稱使用（2026-10-13 確認視為正確）。
# 帶「(含國際證券業務分公司)」：DBS 說明書封面、投資人須知相關機構使用（2026-10-15 確認，Issue #280）。
name_equivalents = ["玉山證券", "玉山綜合證券股份有限公司(含國際證券業務分公司)"]
# 說明書、投資人須知全文每一處「玉山…」都要是 name 或 name_equivalents 其中之一（後面可接「（受託機構）」這類角色括號）；
# 寫錯字或其他簡稱判不一致（2026-10-25 作業人員紅標，Issue #226）。
# 受託或銷售機構設立日期（說明書第二章「受託或銷售機構」段；BBVA 第 1 頁受託機構明細有寫時也核對）。
# 「西元」前綴、全形／半形冒號等寫法差異忽略（2026-10-25 作業人員紅標，Issue #226）。
established = 2000-11-20

[principal_protection]
# 說明書第一章與投資人須知商品簡介的「計價貨幣本金保本率」「投資本金達成保本率之各項條件」要表示不保本（Issue #226）。
# 值以下列寫法之一開頭，後面接的不是中文字（可接說明句）；只收樣本看過的寫法。寫成非 0 的保本率（例：100%）判不一致，
# 其他沒看過的寫法轉人工覆核。「本商品不保本」：HSBC 說明書第一章 8. 的寫法。
non_protected = ["不保本", "本商品不保本", "無", "不適用", "0%", "0.00%"]

[risk]
# 風險等級（說明書中以【RRn】出現；寫法不同的上手見各上手表的 risk_level_formats）。
# 期望值是參考條件表「風險等級」欄（資料庫匯出的是自算風險等級，Issue #239、ADR 0023）；參考條件表沒有這一欄
# （舊 Excel）時才用這裡的 level。
level = "RR4"

# 固定風險警語：由我方提供給上手，應逐字出現在說明書中。
# 比對時忽略所有空白與換行，其餘字元（含全形／半形標點）須完全相同。
# {level} 是這檔商品的風險等級，核對時代入和風險等級核對相同的期望值（Issue #239；例：RR3 商品的警語要寫 RR3）。
# 上手版本（fixed_warning、fixed_warning_openings、fixed_warning_variants）同樣用 {level}。
# BARC 範本中應出現 3 次：封面警語 1、第一章第 2 條、第三章投資風險警語。
fixed_warning = """\
本商品風險程度等級為【{level}】。根據受託機構的風險等級分類，由於本商品並不保本，連結標的為【證券交易所交易證券】，\
在綜合評量包括但不僅限於產品天期、發行機構信用評等與前述因素後，根據受託機構受託買賣境外商品審查管理辦法之\
境外結構型商品風險及適合度評估標準將本商品在風險等級中歸類為【{level}】。*投資人請注意，受託機構將風險等級區分為\
RR1~RR5，RR1、RR2為保守型，RR3、RR4為穩健型，RR5為積極型，本商品風險等級由受託機構釐定及提供，發行機構及/或\
總代理人不對此評級之準確性負任何責任。受託對象僅限依據境外結構型商品管理規則(下稱「管理規則」)投資本商品之\
專業投資人或依據國際證券業務分公司(下稱「OSU」)辦理受託買賣相關規定允許投資本商品之中華民國境外客戶(此類客戶\
依受託機構審核適合投資本產品)(下稱「OSU客戶」) (專業投資人與OSU客戶以下合稱「投資人」)。"""
fixed_warning_occurrences = 3

[fees]
# 第四章「投資人應負擔的各項費用」表的費率區間（鍵為表中費用項目名稱）；忽略空白後逐字相等。
"申購費用" = "0%~5%"
"提前贖回費用" = "0%~5%"
"分銷費用" = "0%~5%"

[issue_price]
# 第一章第 6 條「發行價格為商品面額之 N%」。不等於此值時轉人工覆核，不直接判為錯誤。
pct = 100

[wording]
# 「受託投資」須改為「受託買賣」；但法規原文片語「受託投資或受託買賣」允許出現。
forbidden = ["受託投資"]
allowed_phrases = [
    "受託投資或受託買賣",
    # HSBC 封面警語 7 與第三章：境外結構型商品管理規則的列舉寫法（2026-10-01 確認允許）
    "受託投資、受託買賣或為投資型保單",
    # Citi 警語 7.：管理規則的列舉寫法（2026-10-14 確認允許，Issue #220）
    "受託投資、受託買賣之投資標的",
    # Citi 投資人須知警語 9.（2026-10-14 確認允許，Issue #220）；寫窄，不連帶放過其他上手的「受託投資或銷售時」
    "受託投資或銷售本商品",
    # JPM 警語七：管理規則的列舉寫法（2026-10-15 確認允許，Issue #233）；本機樣本只有 JPM 有這個寫法
    "受託投資/受託買賣",
    # CA 說明書與投資人須知的寫法（2026-10-15 確認加入允許片語，不走 Issue #247 特例；Issue #274）：
    # 封面警語 6、第三章 6.(6)、投資人須知警語 6.「…受託投資或銷售時）」
    "受託投資或銷售時",
    # 封面警語 7（逗號；上面 HSBC 的寫法是頓號）
    "受託投資，受託買賣或為投資型保單",
    # 第三章 6.(7)
    "受託投資或銷售或OSU",
    # 封面警語 11、第三章 6.(11)「為OSU 客戶受託投資之特別風險警語」
    "客戶受託投資之特別風險警語",
    # 第二章 4.「依境外結構型商品管理規則受託投資或受託銷售時」
    "受託投資或受託銷售時",
]
# 交易日（參考條件表）在這天（含）以前的文件，出現上列禁用語時特例通過（結果註明）：作業人員 2026-10-15 已通知
# 各上手改版，改版前的舊範本不再判錯（Issue #247）；2026-10-17 延至 10/30（含）（Issue #338）。拿掉這行即恢復一律判錯。
exempt_until = 2026-10-30

[osu]
# 受託對象與能否承作 OSU 客戶（各上手表的 osu_clients）不一致時，交易日（參考條件表）在這天（含）以前的文件特例通過
# （結果註明）：上手改版前的舊範本（DBS 各處寫 OSU 客戶、JPM 投資人須知受託對象沒寫 OSU 客戶）。預設 2026-11-30，
# 使用者 2026-10-25 決定給上手修正期（Issue #224）。拿掉這行即恢復一律判錯。
exempt_until = 2026-11-30

[currency]
# 說明書中文幣別 → ISO 代碼。封面與金額旁的幣別字都查這張表（金額旁的幣別字 parser 認得的寫法見
# src/fcn_checker/parsers/money.py）；商品幣別不必等於標的幣別（Issue #170）。
# 只收說明書樣本看過的寫法（不猜），沒看過的寫法轉人工覆核（2026-10-10 使用者決定，Issue #170）。
# AUD、EUR、GBP、ZAR 有樣本後加入樣本上的寫法；澳元、南非蘭特等同義寫法沒有樣本，不加（2026-10-13，Issue #185）。
"美元" = "USD"
"日幣" = "JPY"
"日圓" = "JPY"  # 同義寫法，尚無樣本（2026-10-10 使用者同意先加）
"人民幣" = "CNH"
"境外人民幣" = "CNH"  # BARC 第四章最低金額旁的寫法
"港幣" = "HKD"  # MS 樣本的寫法
"港元" = "HKD"  # 同義寫法，尚無樣本
"澳幣" = "AUD"  # HSBC、MS 樣本的寫法
"歐元" = "EUR"  # HSBC 樣本的寫法
"英鎊" = "GBP"  # HSBC 樣本的寫法
"南非幣" = "ZAR"  # MS 樣本的寫法

[currency_code_aliases]
# 「中文幣別(代碼)」括號內代碼的其他寫法（Issue #227）：ISO 代碼 → 也接受的代碼。中文幣別依 [currency] 對到 ISO 代碼，
# 括號內須是那個代碼或這裡列的寫法。只收樣本看過的：GS「人民幣（CNY）」、DBS「人民幣(RMB)」（OOS 樣本，Issue #296）、
# SG 風險揭露「以人民幣(RMB)計值的債券」。
CNH = ["CNY", "RMB"]

[denomination]
# 每單位商品面額預設值（依計價幣別；可承作的八種幣別，2026-10-10 使用者提供的承作幣別表）。客戶可要求不同面額，
# 因此說明書面額不等於預設值時「轉人工審查」，不直接判為錯誤。
USD = 10000
JPY = 1000000
CNH = 100000
HKD = 100000
AUD = 10000
EUR = 10000
GBP = 10000
ZAR = 100000

[iis]
# 投資人須知（檔名結尾 _IIS，docs/checker/rules/iis-check-rules.md）：必須剛好 N 頁。
# 使用者 2026-10-08 確認：比外規「不超過 5 頁」嚴格，5 頁也判不一致。
pages = 4

# ---------------------------------------------------------------- 每家上手一張表
#
# 上手不同的基準寫在 [issuer.<上手代號小寫>]，一家一張表（Issue #128）；新上手只加一張表，不改程式。
# 沒寫的欄位：fixed_warning、fixed_warning_occurrences 用上面 [risk] 的共用值，risk_level_formats 為【{level}】，
# 其他視為該上手沒有這項基準（見下列說明）。可用的欄位與檢查只定義在 src/fcn_checker/config.py 的 ISSUER_FIELDS，
# 寫錯欄位名稱或值時載入設定就回報。
#
# issuer_name：發行機構中英文法人全名，封面「發行機構」與第二章「發行機構」條的「事業名稱」；範本另有只寫中文的出處
#   （MS 第一章第 3 項）時只比中文（第一個括號以前）。比對時忽略空白與換行，其餘（含全形括號）逐字相等。沒有 → 轉人工覆核。
# issuer_name_ignore：發行機構全名比對時另外忽略的寫法差異：brackets 括號（全形／半形）、trailing_period 英文名結尾的句點。
# fixed_warning：該上手的固定警語版本（比對方式同 [risk] fixed_warning，風險等級寫 {level}）；沒有 → 用 [risk] fixed_warning。
# fixed_warning_occurrences：說明書的固定警語次數；沒有 → 用 [risk] fixed_warning_occurrences。
# fixed_warning_openings：固定警語開頭句（到第一個「。」）的其他允許寫法；只換開頭句，其餘仍須與該上手的警語逐字相同。
# fixed_warning_variants：固定警語的其他完整寫法；整段逐字比對，每出現一處都算一次（與該上手的 fixed_warning 合計）。
# risk_level_formats：風險等級的寫法（{level} 為 RRn 的位置）；沒有 → 【{level}】。
# iis_fixed_warning_occurrences：固定警語（該上手版本）在投資人須知出現的次數；沒有 → 轉人工覆核。
# product_type：封面「商品種類」固定值，忽略空白後逐字相等；沒有 → 不核對（MS 依標的數，由 MS 專屬規則核對，不寫在這裡）。
# minimum_issue_size：第四章「發行不成立之情形」的最低有效申購金額寫法，忽略空白後逐字相等；沒有 → 不核對。
# redemption_start_wordings：「開始受理贖回日期：」寫文字的上手允許的寫法（說明書與投資人須知），文字須以其中之一開頭
#   （忽略空白，括號不分全形半形）；只收樣本看過的寫法（Issue #227）。寫具體日期的上手（MS、Citi、BBVA）不設，日期須為
#   發行日的次一營業日。沒有 → 寫文字時轉人工覆核。
# guarantor_name_equivalents：投資人須知相關機構的保證機構名稱可接受的其他寫法，忽略空白後與其中之一相等即視為相符；
#   只用在那一處（說明書與投資人須知警語仍須等於 guarantor_name 的固定值）。
# [issuer.<上手>.product_name]：商品名稱樣板（佔位符見 docs/checker/rules/review-standard.md）；沒有 → 轉人工覆核。
#   所有上手：天期 1 個月時，英文樣板的 `{tenor} Months`／`{tenor}Months` 改成單數 `Month` 比對（只接受單數；
#   BARC、MS、BNP、JPM、GS 適用，寫 `-Month` 的上手不受影響；2026-10-19 確認，Issue #343）。
# [issuer.<上手>.guarantor_name]：保證機構名稱，分出處 cover 封面、ch1 第一章、ch2 第二章，各自為固定值；忽略空白後逐字
#   相等。地址不核對。沒有 → 不核對（沒有保證機構的範本）。
# [issuer.<上手>.agent_name]：總代理人名稱，分出處 cover 封面、ch2 第二章第 3 項(1)；忽略空白後逐字相等。地址電話、負責人
#   不核對。沒有 → 不核對（MS、BNP 決定不核對總代理人）。
# [issuer.<上手>.min_amount_multiples]：各最低金額出處 = 參考條件表「單位面額」× 倍數（鍵為出處欄位名稱）；沒列出的出處
#   倍數為 1。依承作幣別不同時寫成 { ISO 代碼 = 倍數 }，依參考條件表「承作幣別」選（沒列的幣別轉人工覆核）。

[issuer.barc]
issuer_name = "英商巴克萊銀行股份有限公司（Barclays Bank PLC）"
redemption_start_wordings = ["於發行日後的次一個營業日"]  # 說明書與投資人須知同一寫法（Issue #227，依樣本）
iis_fixed_warning_occurrences = 1  # 警語第 1 點（2026-10-08 依樣本確認）

[issuer.barc.product_name]
# 商品名稱格式（依最新 5 份 BARC 說明書，2026-10-01 確認）
# 佔位符：{tenor} 天期月數、{ccy_zh}／{ccy} 幣別中文／ISO 代碼、{memory_zh}／{memory_en} 記憶式時填入
zh = "英商巴克萊銀行{tenor}個月{ccy_zh}計價連結股權{memory_zh}自動提前出場結構型商品（不保本）（無擔保及無保證機構）（下稱「本商品」）"
en = "{tenor} Months {ccy} {memory_en}Autocallable Equity Linked Note issued by Barclays Bank PLC (unsecured and non-guaranteed)"
