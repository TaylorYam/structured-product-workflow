fixed_warning = """本商品風險程度等級為【{level}】。根據受託或銷售機構的風險等級分類，由於本商品並不保本，連結標的為【證券交易所交易證券】，在綜合評量包括但不僅限於產品天期、發行機構信用評等與前述因素後，根據受託或銷售機構受託買賣境外商品審查管理辦法之境外結構型商品風險及適合度評估標準將本商品在風險等級中歸類為【{level}】。*投資人請注意，受託或銷售機構將風險等級區分為RR1~RR5，RR1、RR2為保守型，RR3、RR4為穩健型，RR5為積極型，本商品風險等級由受託或銷售機構釐定及提供，發行機構及/或總代理人不對此評級之準確性負任何責任。受託對象僅限依據境外結構型商品管理規則(下稱「管理規則」)投資本商品之專業投資人或依據國際證券業務分公司(下稱「OSU」)辦理受託買賣相關規定(下稱「OSU相關規範」)允許投資本商品之中華民國境外客戶(此類客戶依受託或銷售機構審核適合投資本產品)(下稱「OSU客戶」) (專業投資人與OSU客戶以下合稱「投資人」)。"""
# DBS：封面警語 1.、商品主要風險揭露 五、1. 共 2 次（2026-10-15 確認，Issue #280）。
fixed_warning_occurrences = 2
# DBS：警語【】；說明書商品基本資料「商品風險程度：RR4」、投資人須知商品簡介「本商品風險程度：RR4」（2026-10-15 確認都核對，
# Issue #280）。
risk_level_formats = ["【{level}】", "風險程度：{level}"]
iis_fixed_warning_occurrences = 1  # 警語 1.（2026-10-15 確認，Issue #280）
# DBS：寫「債券」，不隨標的數改變（2026-10-15 確認，Issue #280）。
product_type = "股權連結債券"

[issuer.dbs.product_name]
# 商品名稱格式（依 4 份 DBS 說明書推得，2026-10-15 確認，Issue #280）：依天期、幣別、Quanto（承作幣別 ≠ 標的報價幣別）、
# 有無 KI；只支援 KO 每日觀察記憶式，固定字樣寫在樣板裡。單一標的沒有樣本（名稱轉人工覆核）。名稱後的「(下稱「本商品」)」不屬於名稱。
zh = "星展銀行{tenor}個月期{ccy_zh}計價{quanto_zh}固定利率記憶型每日觀察自動提前出場{ki_zh}{underlying_zh}股權連結結構型商品(無擔保及無保證機構)(不保本)"
en = "DBS Bank Ltd {tenor}-Month {ccy} {quanto_en}Fixed Coupon Memory Daily Knock-Out {ki_en}{underlying_en}Equity Linked Notes (unsecured and non-guaranteed) (non-principal protected)"
memory_zh = ""
memory_en = ""
quanto_zh = "Quanto"
quanto_en = "Quanto "
ki_zh = "及定價日觸發(歐式)"
ki_en = "European Knock-In "
basket_zh = "一籃子中表現最差"
basket_en = "Worst of Basket "
single_unsupported = true
# 人民幣在英文名稱與計價幣別括號內都寫 RMB（1 份 OOS 樣本，2026-10-16 確認，Issue #296）
ccy_aliases = { CNH = "RMB" }
normalize_brackets = true
# 英文名稱跨行處可能多空白，比對時忽略所有空白
ignore_whitespace_en = true

# DBS：最低申購為單位面額的倍數依承作幣別（USD 5、AUD 7、JPY 8 單位；沒列的幣別轉人工覆核），最低加購、最低贖回、
# 增加贖回單位 1 倍（2026-10-15 確認，Issue #280）。說明書寫單位數與金額，parser 交出金額。CNH 4 單位（1 份 OOS 樣本，
# 2026-10-16 確認，Issue #296）。
[issuer.dbs.min_amount_multiples]
minimum_subscription = { USD = 5, AUD = 7, JPY = 8, CNH = 4 }
minimum_additional = 1
minimum_redemption = 1
redemption_increment = 1
