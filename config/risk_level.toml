#
# 標的種類分只看第一檔標的（UL_1）：在指數清單或 ETF 清單上 3 分，其餘（個股、ADR）4 分。
# 寫彭博代碼，例如 "SPX Index"、"QQQ US Equity"、"1321 JT Equity"。比對時去掉最後的類別字（Index、Equity…）、
# 去頭尾空白、不分大小寫；美國的交易所代碼（UN、UW、UQ、UR、UP、UF…）都當 US，所以 "QQQ US Equity" 對得到資料庫的
# "QQQ UQ"。其他市場要寫交易所代碼（"1321 JT"）。改了清單後，下一次重算才會反映到還沒鎖住的商品；已鎖住的不變。

# 指數清單：可以連結的標的只有指數成分股、ADR、ETF，指數本身不能連結（2026-10-27 確認，#252），所以是空的。
