# 交易所假日表：推算「一籃子預定交易日」（所有標的交易所都開市的日子）用（Issue #208）
#
# 提前出場觀察期的期始日 = 前一期期末日（第 1 期為發行日）後的下一個一籃子預定交易日：跳過週末，
# 也跳過籃子裡任一標的交易所的休市日。標的的市場由彭博代號最後的交易所碼決定（例：GOOGL UW → UW → 美國）。
# 標的的交易所碼不在這裡、或日期不在 covered_from～covered_through 之間時，無法確定是否因假日順延：
# 已知市場的休市日照樣跳過，期始日等於推算結果就通過；比推算結果晚轉需人工覆核，比推算結果早或落在週末仍是不一致。
# 只列全天休市日；提早收盤（半日市）仍算交易日。
# 每年由維護者補下一年的休市日並延長 covered_through（日期以交易所官方公告為準），
# 同時更新上面的 version 與 effective_date，在 PR 說明來源。

version = 4
effective_date = 2026-10-23

