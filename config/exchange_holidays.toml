# 交易所假日表：推算「一籃子預定交易日」（所有標的交易所都開市的日子）用（Issue #208）
#
# 提前出場觀察期的期始日 = 前一期期末日（第 1 期為發行日）後的下一個一籃子預定交易日：跳過週末，
# 也跳過籃子裡任一標的交易所的休市日。標的的市場由彭博代號最後的交易所碼決定（例：GOOGL UW → UW → 美國）。
# 標的的交易所碼不在這裡、或日期不在 covered_from～covered_through 之間時，無法確定是否因假日順延：
# 已知市場的休市日照樣跳過，期始日等於推算結果就通過；比推算結果晚轉需人工覆核，比推算結果早或落在週末仍是不一致。
# 只列全天休市日；提早收盤（半日市）仍算交易日。
# 每年由維護者補下一年的休市日並延長 covered_through（日期以交易所官方公告為準），
# 同時更新上面的 version 與 effective_date，在 PR 說明來源。

version = 3
effective_date = 2026-10-22

[markets.US]
name = "美國（紐約證交所、那斯達克）"
# 彭博美國股票交易所碼：UN 紐約證交所、UW／UQ 那斯達克、UA NYSE American、UP NYSE Arca、UR／UF／UV 其他美國市場、US 美國綜合
bloomberg_codes = ["UN", "UW", "UQ", "UA", "UP", "UR", "UF", "UV", "US"]
# 來源：https://www.nyse.com/markets/hours-calendars（2026-10-14 查閱；官方頁面只列 2026～2028）
covered_from = 2026-01-01
covered_through = 2028-12-31
holidays = [
    # 2026
    2026-01-01, 2026-01-19, 2026-02-16, 2026-04-03, 2026-05-25, 2026-06-19, 2026-07-03, 2026-09-07, 2026-11-26, 2026-12-25,
    # 2027
    2027-01-01, 2027-01-18, 2027-02-15, 2027-03-26, 2027-05-31, 2027-06-18, 2027-07-05, 2027-09-06, 2027-11-25, 2027-12-24,
    # 2028（1 月 1 日是週六，不另補假）
    2028-01-17, 2028-02-21, 2028-04-14, 2028-05-29, 2028-06-19, 2028-07-04, 2028-09-04, 2028-11-23, 2028-12-25,
]

[markets.JP]
