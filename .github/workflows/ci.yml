name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whitespace:
    name: Check patch whitespace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}...HEAD"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git show --format= --check HEAD
          else
            git diff --check "${BEFORE_SHA}...HEAD"
          fi

  python:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install package and dev dependencies
        run: python -m pip install -c constraints.txt -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      # 真實樣本測試只在本機設定 SPW_REAL_SAMPLES_DIR 時執行；CI 自動略過
      - name: Test
        run: pytest -q

  windows-install:
    name: Windows install resolution (Python 3.11-3.15)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 作業人員在 Windows 用 setup_panel.cmd 安裝，Python 版本由他們的電腦決定（#15）。
      # 模擬 Windows amd64 上每個支援的 Python 版本，確認 constraints.txt 的鎖定版本都有安裝檔。
      # 執行期套件同 pyproject.toml 的 dependencies；環境標記在 Linux 上會被略過，所以先拿掉。
      - name: Resolve pinned runtime packages for each Python version
        run: |
          sed 's/;.*//' constraints.txt | grep -v '^#' > "$RUNNER_TEMP/constraints.txt"
          for version in 3.11 3.12 3.13 3.14 3.15; do
            echo "::group::Python $version"
            python -m pip install --dry-run --quiet --ignore-installed --only-binary=:all:               --implementation cp --platform win_amd64 --python-version "$version"               --target "$RUNNER_TEMP/target-$version" -c "$RUNNER_TEMP/constraints.txt"               pymupdf openpyxl pywin32
            echo "::endgroup::"
          done
